server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/codevisualizer}

# JWT
app.jwt.secret=${JWT_SECRET:codevisualizer-jwt-secret-key-change-in-production-must-be-32-chars}
app.jwt.expiration-ms=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:8080}/api/auth/callback/google

# Frontend URL (for CORS and OAuth redirect)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Tracer paths
app.tracer.java-class-path=${TRACER_JAVA_PATH:../lib/java}
app.tracer.python-script=${TRACER_PYTHON_PATH:../lib/python/tracer.py}
app.tracer.gdb-script=${TRACER_GDB_PATH:../lib/c/gdb_tracer.py}

# Logging
logging.level.com.codevisualizer=DEBUG
